<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>Cuttana — все работы</title>
    <meta name="description" content="Cuttana — галерея работ." />
    <meta name="theme-color" content="#0c0f0d" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=23" />
  </head>
  <body>
    <!-- Header (solid on subpage) -->
    <header class="header scrolled" id="header">
      <div class="wrap header__inner">
        <a href="index.html" class="brand" aria-label="Cuttana">
          <img class="brand__logo" src="assets/logo.png" alt="Cuttana" onerror="this.style.display='none'" />
          <span class="brand__name">Cut<b>tana</b></span>
        </a>
        <nav class="nav" id="nav">
          <div class="nav__links">
            <a href="index.html#services" data-i18n="nav.services">Услуги</a>
            <a href="index.html#why" data-i18n="nav.why">Почему мы</a>
            <a href="index.html#team" data-i18n="nav.team">Команда</a>
            <a href="index.html#location" data-i18n="nav.location">Контакты</a>
            <a class="btn btn--primary nav__book" href="index.html#booking" data-i18n="nav.book">Записаться</a>
          </div>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="pl">PL</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button class="nav__toggle" id="navToggle" aria-label="Menu" aria-expanded="false"></button>
        </nav>
      </div>
    </header>

    <main class="section subpage">
      <div class="wrap">
        <a class="subpage__back" href="index.html#work">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5" /><path d="m12 19-7-7 7-7" /></svg>
          <span data-i18n="clients.back">На главную</span>
        </a>

        <div class="section-head">
          <span class="tag" data-i18n="work.tag">Работы</span>
          <h1 class="title" data-i18n="clients.title">Все работы</h1>
          <p class="lead" data-i18n="clients.subtitle">Полная галерея работ Cuttana.</p>
        </div>

        <!-- Filters -->
        <div class="filters">
          <div class="filter">
            <span class="filter__label">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3" /><path d="M8.12 8.12 12 12" /><path d="M20 4 8.12 15.88" /><circle cx="6" cy="18" r="3" /><path d="M14.8 14.8 20 20" /></svg>
              <span data-i18n="clients.filterBarber">Мастер</span>
            </span>
            <div class="filter__opts" id="filterBarber"></div>
          </div>
          <div class="filter">
            <span class="filter__label">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8L3 4Z" /></svg>
              <span data-i18n="clients.filterService">Услуга</span>
            </span>
            <div class="filter__opts" id="filterService"></div>
          </div>
          <div class="filter__count">
            <b id="resultCount">0</b> <span data-i18n="clients.count">работ</span>
          </div>
        </div>

        <!-- Results -->
        <div class="cases" id="casesGrid"></div>
        <div class="empty" id="emptyState" style="display: none" data-i18n="clients.empty">
          Нет работ по выбранным фильтрам.
        </div>
      </div>
    </main>

    <footer class="footer" id="footer">
      <div class="wrap">
        <div class="footer__bottom" style="border: 0; padding-top: 0">
          <span>© <span id="year"></span> Cuttana Barbershop. <span data-i18n="footer.rights">Все права защищены.</span></span>
          <a href="index.html" data-i18n="clients.back">На главную</a>
        </div>
      </div>
    </footer>

    <script src="js/data.js?v=23"></script>
    <script src="js/icons.js?v=23"></script>
    <script src="js/i18n.js?v=23"></script>
    <script src="js/clients.js?v=23"></script>
  </body>
</html>
